<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeXStudio AI</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

  <script>
    
    window.MathJax = {
      tex: {
        inlineMath: [['$','$'],['\\(','\\)']],
        displayMath: [['$$','$$'],['\\[','\\]']]
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
      startup: { typeset: false }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & Variables ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #0d0d0f;
      --panel:        #111114;
      --sidebar-bg:   #0f0f12;
      --border:       #1e1e26;
      --accent:       #c8ff57;
      --accent2:      #57c8ff;
      --accent-dim:   rgba(200,255,87,0.12);
      --text:         #e8e8f0;
      --muted:        #52525e;
      --preview-bg:   #13131a;
      --preview-text: #ccccd8;
      --code-bg:      #1a1a24;
      --table-border: #2a2a38;
      --abstract-bg:  rgba(200,255,87,0.03);
      --item-hover:   rgba(255,255,255,0.04);
      --item-active:  rgba(200,255,87,0.08);
    }

    :root[data-theme="light"] {
      --bg:           #f2f2ee;
      --panel:        #e8e8e4;
      --sidebar-bg:   #ececе8;
      --border:       #d0d0c8;
      --accent:       #2d7a00;
      --accent2:      #0066aa;
      --accent-dim:   rgba(45,122,0,0.1);
      --text:         #1a1a1a;
      --muted:        #888880;
      --preview-bg:   #ffffff;
      --preview-text: #2a2a2a;
      --code-bg:      #f0f0ec;
      --table-border: #d8d8d0;
      --abstract-bg:  rgba(45,122,0,0.04);
      --item-hover:   rgba(0,0,0,0.04);
      --item-active:  rgba(45,122,0,0.08);
    }

    /* ── Base Layout ────────────────────────────────────────── */
    html, body {
      height: 100%;
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 50px;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      user-select: none;
    }
    .logo-badge {
      background: var(--accent);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 1px;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 800; }
    .btn.primary:hover { filter: brightness(1.1); }

    /* ── Workspace (sidebar + editor + preview) ─────────────── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── File Explorer Sidebar ──────────────────────────────── */
    .sidebar {
      width: 220px;
      min-width: 180px;
      max-width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: width 0.2s ease;
    }

    .sidebar.collapsed { width: 0; min-width: 0; border-right: none; }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      height: 38px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sidebar-actions {
      display: flex;
      gap: 4px;
    }
    .ai-response{
        margin-top:12px;
        padding:10px;

        min-height:120px;
        max-height:300px;

        overflow:auto;

        background:var(--bg);
        border:1px solid var(--border);
        border-radius:6px;

        font-family:'JetBrains Mono', monospace;
        font-size:11px;
        white-space:pre-wrap;

        color:var(--text);
    }
    .icon-btn {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--item-hover); color: var(--text); }

    .sidebar-tree {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    /* Scrollbar */
    .sidebar-tree::-webkit-scrollbar { width: 4px; }
    .sidebar-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Tree Nodes ─────────────────────────────────────────── */
    .tree-node { user-select: none; }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding-right: 10px;
      cursor: pointer;
      border-radius: 4px;
      margin: 1px 6px;
      transition: background 0.1s;
      position: relative;
    }
    .tree-row:hover { background: var(--item-hover); }
    .tree-row.active { background: var(--item-active); }
    .tree-row.active .tree-label { color: var(--accent); }

    .tree-indent { flex-shrink: 0; }
    .tree-toggle {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .tree-toggle.open { transform: rotate(90deg); }
    .tree-toggle.leaf { opacity: 0; pointer-events: none; }

    .tree-icon {
      font-size: 14px;
      flex-shrink: 0;
      line-height: 1;
    }

    .tree-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
    }

    .tree-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      background: var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }

    .tree-children { overflow: hidden; }
    .tree-children.collapsed { display: none; }

    /* Drop zone highlight */
    .tree-row.drag-over {
      background: var(--accent-dim) !important;
      outline: 1px dashed var(--accent);
    }

    /* ── Context Menu ───────────────────────────────────────── */
    .ctx-menu {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px;
      z-index: 9999;
      min-width: 160px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
      animation: ctx-pop 0.1s ease;
    }
    @keyframes ctx-pop {
      from { transform: scale(0.95); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .ctx-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: var(--item-hover); }
    .ctx-item.danger { color: #ff6b6b; }
    .ctx-item.danger:hover { background: rgba(255,107,107,0.1); }
    .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

    /* ── Image Preview Tooltip ──────────────────────────────── */
    .img-tooltip {
      position: fixed;
      z-index: 9998;
      pointer-events: none;
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .img-tooltip img {
      max-width: 180px;
      max-height: 140px;
      border-radius: 4px;
      display: block;
      object-fit: contain;
    }
    .img-tooltip-name {
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
    }

    /* ── Editor + Preview Panes ─────────────────────────────── */
    .panes {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .pane-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .pane-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .v-divider {
      width: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    #editor-container {
      flex: 1;
      overflow: hidden;
    }

    #preview-pane {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      background: var(--preview-bg);
      font-family: 'Georgia', serif;
      font-size: 15px;
      line-height: 1.85;
      color: var(--preview-text);
      transition: background 0.2s, color 0.2s;
    }

    /* Preview typography */
    #preview-pane h1,h2,h3,h4 { color: var(--text); margin: 1.2em 0 0.5em; font-family: 'Syne', sans-serif; }
    #preview-pane h1.doc-title { text-align: center; font-size: 1.7em; margin-bottom: 0.1em; }
    #preview-pane p.doc-author { text-align: center; color: var(--muted); font-size: 13px; margin: 0.2em 0; }
    #preview-pane p.doc-date   { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 1em; }
    #preview-pane .doc-titleblock-marker { border-top: 1px solid var(--border); margin: 0.5em 0 1.2em; }
    #preview-pane .abstract {
      border-left: 3px solid var(--accent);
      padding: 10px 16px; margin: 1.2em 0;
      color: var(--muted); background: var(--abstract-bg);
      border-radius: 0 6px 6px 0;
    }
    #preview-pane .abstract-label {
      display: block; color: var(--accent); font-size: 10px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px;
      font-family: 'Syne', sans-serif;
    }
    #preview-pane table { border-collapse: collapse; margin: 1em 0; font-size: 13px; }
    #preview-pane td, #preview-pane th { border: 1px solid var(--table-border); padding: 5px 12px; }
    #preview-pane code {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: var(--code-bg); padding: 1px 5px; border-radius: 3px; color: var(--accent2);
    }
    #preview-pane pre {
      background: var(--code-bg); padding: 12px 16px; border-radius: 6px;
      overflow-x: auto; margin: 1em 0; font-size: 12px;
    }
    #preview-pane ul, #preview-pane ol { padding-left: 1.8em; margin: 0.5em 0; }
    #preview-pane p { margin-bottom: 0.6em; }
    #preview-pane img { max-width: 100%; border-radius: 4px; margin: 0.5em 0; }

    /* Preview scrollbar */
    #preview-pane::-webkit-scrollbar { width: 5px; }
    #preview-pane::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Status Bar ─────────────────────────────────────────── */
    .status-bar {
      height: 24px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 16px;
      font-size: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

    /* ── AI Floating Button ─────────────────────────────────── */
    #ai-btn {
      position: fixed;
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      z-index: 9000;
      box-shadow: 0 4px 20px rgba(200,255,87,0.2);
      letter-spacing: 0.5px;
      transition: all 0.15s;
      animation: pop-in 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    #ai-btn:hover { box-shadow: 0 6px 28px rgba(200,255,87,0.35); transform: translateY(-1px); }
    .ai-spark { animation: spin 3s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop-in { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* ── Agentic Command Bar (bottom center) ────────────────── */
    #agent-bar {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: min(640px, calc(100vw - 280px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      z-index: 500;
      transition: border-color 0.15s;
    }
    #agent-bar:focus-within { border-color: var(--accent); }

    .agent-bar-quick {
      display: flex;
      gap: 6px;
      padding: 8px 10px 0;
      flex-wrap: wrap;
    }
    .agent-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.12s, color 0.12s;
    }
    .agent-chip:hover { border-color: var(--accent); color: var(--accent); }

    .agent-bar-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
    }
    .agent-bar-input-row .ai-spark { color: var(--accent); font-size: 14px; }
    #agent-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
    }
    #agent-input::placeholder { color: var(--muted); }
    #agent-send {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
    }
    #agent-send:disabled { opacity: 0.5; cursor: default; }
    #agent-send:hover:not(:disabled) { filter: brightness(1.1); }

    #agent-status {
      font-size: 10px;
      color: var(--muted);
      padding: 0 10px 8px;
      font-family: 'JetBrains Mono', monospace;
      display: none;
    }

    /* ── AI Panel ───────────────────────────────────────────── */
    #ai-panel {
      display: none;
      position: fixed;
      bottom: 28px; right: 28px;
      width: 340px;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 18px;
      z-index: 9999;
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
      animation: slide-up 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slide-up { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .ai-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .ai-panel-title { font-size: 12px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 6px; }
    .ai-close { cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; transition: color 0.1s; }
    .ai-close:hover { color: var(--text); }
    .ai-selection-preview {
      background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
      padding: 9px 11px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--muted); margin-bottom: 12px; max-height: 68px; overflow: hidden; position: relative;
    }
    .ai-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .ai-action-btn {
      font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
      padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text); cursor: pointer; transition: all 0.12s; letter-spacing: 0.3px;
    }
    .ai-action-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(87,200,255,0.06); }

    /* ── Upload area in sidebar ─────────────────────────────── */
    .upload-drop-area {
      margin: 8px 8px 4px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-drop-area:hover, .upload-drop-area.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .upload-drop-area p {
      font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px;
    }
    .upload-drop-area span { font-size: 18px; display: block; margin-bottom: 3px; }
    #file-input { display: none; }

    /* ── Rename inline input ────────────────────────────────── */
    .rename-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg);
      border: 1px solid var(--accent);
      color: var(--text);
      border-radius: 3px;
      padding: 1px 5px;
      outline: none;
      width: 120px;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ══ HEADER ══════════════════════════════════════════════ -->
  <header class="header">
    <div class="logo" style="display:flex;align-items:center;gap:10px;">
      <button class="btn" onclick="window.location.href='/projects'" title="Back to projects">← Projects</button>
      TeX<span style="color:var(--accent)">Studio</span>
      <span class="logo-badge">AI</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="theme-btn" onclick="toggleTheme()">☀ Light</button>
      <button class="btn" onclick="toggleSidebar()">⊞ Files</button>
      <button class="btn" onclick="clearEditor()">Clear</button>
      <button class="btn" onclick="loadExample()">Example</button>
      <!-- <button class="btn primary" onclick="renderPreview()">Render ▶</button> -->
      <button class="btn primary" id="compile-btn" onclick="compilePdf()">Compile PDF ▶</button>
      <button class="btn" onclick="downloadPdf()">Download PDF</button>
      <span id="user-email-tag" style="font-size:11px;color:var(--muted);margin-left:6px;">…</span>
      <button class="btn" onclick="handleSignOut()">Sign out</button>
    </div>
  </header>

  <!-- ══ WORKSPACE ═══════════════════════════════════════════ -->
  <div class="workspace">

    <!-- ── File Explorer Sidebar ──────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Explorer</span>
        <div class="sidebar-actions">
          <button class="icon-btn" title="New folder" onclick="createFolder()">📁</button>
          <button class="icon-btn" title="Upload files" onclick="document.getElementById('file-input').click()">⬆</button>
          <button class="icon-btn" title="Collapse all" onclick="collapseAll()">⊟</button>
        </div>
      </div>

      <!-- Upload drop area -->
      <div class="upload-drop-area" id="upload-drop-area"
           onclick="document.getElementById('file-input').click()"
           ondragover="handleDragOver(event,this)"
           ondragleave="handleDragLeave(this)"
           ondrop="handleFileDrop(event)">
        <span>🖼</span>
        <p>Drop images / files here</p>
      </div>
      <input type="file" id="file-input" multiple accept="image/*,.tex,.bib,.cls,.sty" onchange="handleFileInput(this)">

      <!-- Tree -->
      <div class="sidebar-tree" id="sidebar-tree"></div>
    </aside>

    <!-- ── Panes: editor + preview ────────────────────────── -->
    <div class="panes">
      <!-- Editor -->
      <div class="pane">
        <div class="pane-header">
          <span class="pane-title">LaTeX Source</span>
          <div class="pane-dot"></div>
        </div>
        <div id="editor-container"></div>
      </div>

      <div class="v-divider"></div>

      <!-- Preview -->
      <div class="pane">
        <div class="pane-header">

<script>

// Base URL of the LaTeX Editor backend (LatexEditorBackEnd/LatexEditorBackend.py).
// Point this at your own backend, e.g. "http://localhost:8000" for local dev,
// or your own ngrok/hosted URL for a publicly reachable deployment.
const API_BASE = "http://localhost:8000";




// ── State ───────────────────────────────────────────────────
let editor;
let renderTimer;
let selectedText = '';
let compiling = false;

// File tree: flat map of id → node
// node = { id, name, type:'folder'|'file'|'image', parentId, children:[], open, dataUrl?, mimeType? }
let nodeMap = {};
let currentProjectId = null;
const ROOT_ID = 'root';
let nodeSeq = 0;

    function mkId() {
        return "n" + (++nodeSeq);
    }

// ── Cloudinary config ────────────────────────────────────────
// Fill these in with your Cloudinary cloud name and an *unsigned*
// upload preset (Cloudinary dashboard → Settings → Upload → Upload presets).
const CLOUDINARY = {
    cloudName:    "YOUR_CLOUD_NAME",
    uploadPreset: "YOUR_UPLOAD_PRESET"
};

async function uploadToCloudinary(file) {
    if (CLOUDINARY.cloudName === "YOUR_CLOUD_NAME") {
        throw new Error("Cloudinary not configured. Set cloudName + uploadPreset in editor.html.");
    }
    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", CLOUDINARY.uploadPreset);
    // 'auto' resource type handles both images and PDFs
    const res = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/auto/upload`,
        { method: "POST", body: form }
    );
    if (!res.ok) throw new Error("Cloudinary upload failed: " + await res.text());
    const data = await res.json();
    return data.secure_url;
}

// ── Path helpers (Firestore stores one doc per file, keyed by path) ──
function pathToDocId(path) { return path.replace(/\//g, "|"); }
function dirOf(path)  { const i = path.lastIndexOf("/"); return i < 0 ? "" : path.slice(0, i); }
function baseName(path){ const i = path.lastIndexOf("/"); return i < 0 ? path : path.slice(i + 1); }

async function saveFile(path, content) {
    await setDoc(
        doc(db, "projects", currentProjectId, "files", pathToDocId(path)),
        { path, type: "file", content, updatedAt: Date.now() }
    );
}
async function saveImageDoc(path, url) {
    await setDoc(
        doc(db, "projects", currentProjectId, "files", pathToDocId(path)),
        { path, type: "image", url, updatedAt: Date.now() }
    );
}
async function deleteFileDoc(path) {
    await deleteDoc(doc(db, "projects", currentProjectId, "files", pathToDocId(path)));
}

// Find (or lazily create) the folder node for a given directory path.
function ensureFolderByPath(dirPath) {
    if (!dirPath) return ROOT_ID;
    for (const n of Object.values(nodeMap)) {
        if (n.type === "folder" && n.path === dirPath) return n.id;
    }
    const parentId = ensureFolderByPath(dirOf(dirPath));
    const id = mkId();
    nodeMap[id] = { id, name: baseName(dirPath), path: dirPath, type: "folder", parentId, children: [], open: true };
    nodeMap[parentId].children.push(id);
    return id;
}


// ── Bootstrap file tree ──────────────────────────────────────
function initTree() {

    nodeMap = {};
    
    nodeMap[ROOT_ID] = {
        id: ROOT_ID,
        name: "No Project",
        type: "folder",
        parentId: null,
        path: "",
        children: [],
        open: true
    };

    renderTree();
}

// Create a folder node in memory. Folders are persisted implicitly through the
// paths of the files inside them (empty folders are not stored).
function addFolder(name, parentId = ROOT_ID) {
  const dir = nodeMap[parentId].path || "";
  const path = dir ? dir + "/" + name : name;
  const id = mkId();
  nodeMap[id] = { id, name, path, type: 'folder', parentId, children: [], open: true };
  nodeMap[parentId].children.push(id);
  return id;
}

// Create a file/image node and persist it to Firestore immediately.
async function addFile(name, type, parentId = ROOT_ID, extra = {}) {
  const dir = nodeMap[parentId].path || "";
  const path = dir ? dir + "/" + name : name;
  const id = mkId();
  nodeMap[id] = { id, name, path, type, parentId, children: [], open: false,
                  content: extra.content || "", url: extra.url };
  nodeMap[parentId].children.push(id);
  nodeMap[parentId].open = true;
  updateFileCount();
  try {
    if (type === "image") await saveImageDoc(path, extra.url);
    else await saveFile(path, extra.content || "");
  } catch (e) { console.error("Persist new file failed:", e); }
  return id;
}

// Remove a node (and descendants) from memory AND Firestore.
async function removeNode(id) {
  const node = nodeMap[id];
  if (!node || id === ROOT_ID) return;

  // Collect file/image descendant paths to delete from Firestore.
  const toDelete = [];
  (function collect(nid) {
    const n = nodeMap[nid];
    if (!n) return;
    if (n.type !== "folder" && n.path) toDelete.push(n.path);
    [...n.children].forEach(collect);
  })(id);

  for (const p of toDelete) {
    try { await deleteFileDoc(p); } catch (e) { console.error("Delete doc failed:", e); }
  }

  if (toDelete.includes(node.path) || activeNodeId === id) activeNodeId = null;

  const parent = nodeMap[node.parentId];
  if (parent) parent.children = parent.children.filter(c => c !== id);
  (function purge(nid) {
    const n = nodeMap[nid];
    if (!n) return;
    [...n.children].forEach(purge);
    delete nodeMap[nid];
  })(id);
  updateFileCount();
}

// Recompute paths after a rename or move, and rewrite affected Firestore docs.
async function persistRenameMove(id, { newName, newParentId } = {}) {
  const node = nodeMap[id];
  if (!node || id === ROOT_ID) return;

  // Snapshot file/image leaves with their old paths BEFORE mutating.
  const leaves = [];
  (function rec(nid) {
    const n = nodeMap[nid];
    if (!n) return;
    if (n.type !== "folder") leaves.push(n);
    n.children.forEach(rec);
  })(id);
  const oldPaths = new Map(leaves.map(n => [n, n.path]));

  if (newName) node.name = newName;
  if (newParentId && newParentId !== node.parentId) {
    const op = nodeMap[node.parentId];
    if (op) op.children = op.children.filter(c => c !== id);
    node.parentId = newParentId;
    nodeMap[newParentId].children.push(id);
    nodeMap[newParentId].open = true;
  }

  // Recompute paths top-down.
  (function recompute(nid) {
    const n = nodeMap[nid];
    const pdir = nodeMap[n.parentId] ? (nodeMap[n.parentId].path || "") : "";
    n.path = pdir ? pdir + "/" + n.name : n.name;
    n.children.forEach(recompute);
  })(id);

  // Rewrite docs for leaves whose path changed.
  for (const n of leaves) {
    const oldPath = oldPaths.get(n);
    if (oldPath === n.path) continue;
    try {
      if (n.type === "image") await saveImageDoc(n.path, n.url);
      else await saveFile(n.path, n.content || "");
      await deleteFileDoc(oldPath);
    } catch (e) { console.error("Rename/move persist failed:", e); }
  }
}

//need to changed
function updateFileCount() {
  const count = Object.values(nodeMap).filter(n => n.type !== 'folder').length;
  document.getElementById('file-count').textContent = count + ' file' + (count !== 1 ? 's' : '');
}

// ── Render Tree ──────────────────────────────────────────────
let activeNodeId = null;

function renderTree() {
  const container = document.getElementById('sidebar-tree');
  container.innerHTML = '';
  renderNode(ROOT_ID, 0, container);
}

function renderNode(id, depth, container) {
  const node = nodeMap[id];
  if (!node) return;

  const wrap = document.createElement('div');
  wrap.className = 'tree-node';
  wrap.dataset.id = id;

  // Skip rendering the root row itself but render its children
  if (id !== ROOT_ID) {
    const row = document.createElement('div');
    row.className = 'tree-row' + (activeNodeId === id ? ' active' : '');
    row.dataset.id = id;

    // indent
    const indent = document.createElement('div');
    indent.className = 'tree-indent';
    indent.style.width = ((depth - 1) * 14 + 6) + 'px';
    row.appendChild(indent);

    // toggle
    const toggle = document.createElement('div');
    toggle.className = 'tree-toggle' + (node.type === 'folder' ? (node.open ? ' open' : '') : ' leaf');
    toggle.textContent = '▶';
    row.appendChild(toggle);

    // icon
    const icon = document.createElement('div');
    icon.className = 'tree-icon';
    icon.textContent = nodeIcon(node);
    row.appendChild(icon);

    // label
    const label = document.createElement('div');
    label.className = 'tree-label';
    label.textContent = node.name;
    row.appendChild(label);

    // events
    row.addEventListener('click', e => { e.stopPropagation(); onNodeClick(id); });
    row.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showCtxMenu(e, id); });

    // image tooltip
    if ( node.type === 'image' &&
    (
        node.url ||
        node.downloadUrl ||
        node.dataUrl
    )) {
      row.addEventListener('mouseenter', e => showImgTooltip(e, node));
      row.addEventListener('mousemove', e => moveImgTooltip(e));
      row.addEventListener('mouseleave', hideImgTooltip);
    }

    // drag & drop for images into folders
    if (node.type !== 'folder') {
      row.draggable = true;
      row.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', id); });
    }
    if (node.type === 'folder') {
      row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', e => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const dragId = e.dataTransfer.getData('text/plain');
        if (dragId && dragId !== id) moveNode(dragId, id);
      });
    }

    wrap.appendChild(row);
  }

  // children
  if (node.type === 'folder') {
    const childWrap = document.createElement('div');
    childWrap.className = 'tree-children' + (id === ROOT_ID || node.open ? '' : ' collapsed');
    node.children.forEach(cid => renderNode(cid, depth + 1, childWrap));
    wrap.appendChild(childWrap);
  }

  container.appendChild(wrap);
}

function nodeIcon(node) {
  if (node.type === 'folder') return node.open ? '📂' : '📁';
  if (node.type === 'image') return '🖼';
  if (node.name.endsWith('.tex')) return '📄';
  if (node.name.endsWith('.bib')) return '📚';
  return '📃';
}

function onNodeClick(id) {
  const node = nodeMap[id];
  if (!node) return;
  if (node.type === 'folder') {
    node.open = !node.open;
    renderTree();
  } else {

      // Flush any pending edits to the previously-open file before switching.
      flushSave();

      activeNodeId = id;

      renderTree();

      if (
          node.type === "file" &&
          editor
      ) {

          editor.setValue(
              node.content || ""
          );

          document.getElementById(
              "status-text"
          ).textContent =
          `Opened ${node.name}`;
      }

      if (
          node.type === "image"
      ) {

          showImagePreview(
              node
          );
      }
  }
}


// ── Image Preview Modal ─────────────────────────────────────
function showImagePreview(node){

    const modal =
        document.getElementById(
            "image-modal"
        );

    const img =
        document.getElementById(
            "image-modal-img"
        );

    img.src =
    node.url ||
    node.downloadUrl ||
    node.dataUrl;

    modal.style.display =
        "flex";
}

document
.getElementById(
    "image-modal"
)
.addEventListener(
    "click",
    function(){

        this.style.display =
            "none";

    }
);
async function moveNode(nodeId, newParentId) {
  const node = nodeMap[nodeId];
  if (!node || nodeId === newParentId) return;
  // Prevent dropping a folder into its own descendant.
  let p = nodeMap[newParentId];
  while (p) { if (p.id === nodeId) return; p = nodeMap[p.parentId]; }
  await persistRenameMove(nodeId, { newParentId });
  renderTree();
}

// ── Cloud Storage (path-based, one doc per file/image) ───────────

// Debounced autosave state for the active file.
let pendingSaveTimer = null;

function scheduleSave() {
    if (!activeNodeId || !editor) return;
    const node = nodeMap[activeNodeId];
    if (!node || node.type !== "file") return;
    node.content = editor.getValue();
    document.getElementById("status-text").textContent = "Editing…";
    clearTimeout(pendingSaveTimer);
    pendingSaveTimer = setTimeout(flushSave, 800);
}

async function flushSave() {
    clearTimeout(pendingSaveTimer);
    pendingSaveTimer = null;
    if (!activeNodeId || !editor) return;
    const node = nodeMap[activeNodeId];
    if (!node || node.type !== "file") return;
    node.content = editor.getValue();
    try {
        await saveFile(node.path, node.content);
        document.getElementById("status-text").textContent = "Saved ✓";
    } catch (e) {
        console.error("Save failed:", e);
        document.getElementById("status-text").textContent = "Save failed";
    }
}

// Best-effort flush when the tab is closing/hidden.
window.addEventListener("beforeunload", () => { flushSave(); });
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") flushSave();
});

async function loadProject(projectId) {
    nodeMap = {};
    activeNodeId = null;

    nodeMap[ROOT_ID] = {
        id: ROOT_ID,
        name: projectId,
        type: "folder",
        parentId: null,
        path: "",
        children: [],
        open: true
    };

    const snapshot = await getDocs(
        collection(db, "projects", projectId, "files")
    );

    const docs = [];
    snapshot.forEach(docSnap => docs.push(docSnap.data()));

    // Sort by path so parent folders are created before their children.
    docs.sort((a, b) =>
        (a.path || a.name || "").localeCompare(b.path || b.name || "")
    );

    docs.forEach(file => {
        // Backward-compat: older docs only had `name` and `downloadUrl`.
        const path = file.path || file.name;
        if (!path) return;
        const parentId = ensureFolderByPath(dirOf(path));
        const id = mkId();
        nodeMap[id] = {
            id,
            name: baseName(path),
            path,
            type: file.type === "image" ? "image" : "file",
            parentId,
            children: [],
            open: false,
            content: file.content,
            url: file.url || file.downloadUrl
        };
        nodeMap[parentId].children.push(id);
    });

    renderTree();
    updateFileCount();
    openInitialFile();
}

// Open main.tex (or the first text file) once both the project and editor are ready.
function openInitialFile() {
    if (!editor) { setTimeout(openInitialFile, 150); return; }
    if (activeNodeId) return;
    const files = Object.values(nodeMap).filter(n => n.type === "file");
    const target = files.find(n => n.name === "main.tex") || files[0];
    if (target) onNodeClick(target.id);
}

// ── Context Menu ─────────────────────────────────────────────
let ctxTargetId = null;

function showCtxMenu(e, id) {
  ctxTargetId = id;
  const node = nodeMap[id];
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = '';

  const items = [];
  if (node.type === 'folder') {
    items.push({ icon:'📁', label:'New Folder', action: () => { createFolder('New Folder', id); renderTree(); } });
    items.push({ icon:'📄', label:'New .tex File', action: async () => { const nid = await addFile('untitled.tex', 'file', id); renderTree(); startRename(nid); } });
    items.push('sep');
  }
  if (node.type === 'image') {
    items.push({ icon:'📋', label:'Copy \\includegraphics', action: () => copyInclude(node) });
    items.push('sep');
  }
  items.push({ icon:'✏️', label:'Rename', action: () => startRename(id) });
  if (id !== ROOT_ID) {
    items.push('sep');
    items.push({ icon:'🗑', label:'Delete', action: async () => { await removeNode(id); renderTree(); }, danger: true });
  }

  items.forEach(item => {
    if (item === 'sep') {
      const sep = document.createElement('div');
      sep.className = 'ctx-sep';
      menu.appendChild(sep);
    } else {
      const el = document.createElement('div');
      el.className = 'ctx-item' + (item.danger ? ' danger' : '');
      el.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
      el.addEventListener('click', () => { hideCtxMenu(); item.action(); });
      menu.appendChild(el);
    }
  });

  menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 10) + 'px';
  menu.style.display = 'block';
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').style.display = 'none';
}

function copyInclude(node) {
  navigator.clipboard.writeText(`\\includegraphics[width=\\linewidth]{${node.path || node.name}}`);
}

// ── Rename ───────────────────────────────────────────────────
function startRename(id) {
  const node = nodeMap[id];
  const row = document.querySelector(`.tree-row[data-id="${id}"]`);
  if (!row) return;
  const label = row.querySelector('.tree-label');
  const input = document.createElement('input');
  input.className = 'rename-input';
  input.value = node.name;
  label.replaceWith(input);
  input.focus();
  input.select();
  const finish = async () => {
    const val = input.value.trim();
    if (val && val !== node.name) {
      await persistRenameMove(id, { newName: val });
    }
    renderTree();
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = node.name; input.blur(); } });
}

// ── Folder creation ──────────────────────────────────────────
function createFolder(name = 'New Folder', parentId = ROOT_ID) {
  const id = addFolder(name, parentId);
  nodeMap[parentId].open = true;
  renderTree();
  // auto-rename
  setTimeout(() => startRename(id), 50);
}

function collapseAll() {
  Object.values(nodeMap).forEach(n => { if (n.type === 'folder' && n.id !== ROOT_ID) n.open = false; });
  renderTree();
}

// ── File Upload ──────────────────────────────────────────────
function handleFileInput(input) {
  Array.from(input.files).forEach(processFile);
  input.value = '';
}

function handleDragOver(e, el) {
  e.preventDefault();
  el.classList.add('drag-over');
}
function handleDragLeave(el) { el.classList.remove('drag-over'); }

function handleFileDrop(e) {
  e.preventDefault();
  document.getElementById('upload-drop-area').classList.remove('drag-over');
  Array.from(e.dataTransfer.files).forEach(processFile);
}

// ── Image Tooltip ────────────────────────────────────────────

async function processFile(file) {

    if (!currentProjectId) {
        alert("Create/Open a project first");
        return;
    }

    const isBinary = file.type.startsWith("image/") ||
                     file.type === "application/pdf" ||
                     /\.(png|jpe?g|gif|svg|pdf|eps)$/i.test(file.name);

    try {
        if (isBinary) {
            document.getElementById("status-text").textContent = "Uploading " + file.name + "…";
            const url = await uploadToCloudinary(file);
            await addFile(file.name, "image", ROOT_ID, { url });
            document.getElementById("status-text").textContent = "Uploaded " + file.name + " ✓";
        } else {
            const text = await file.text();
            await addFile(file.name, "file", ROOT_ID, { content: text });
            document.getElementById("status-text").textContent = "Added " + file.name + " ✓";
        }
        renderTree();
    } catch (e) {
        console.error("Upload failed:", e);
        alert("Could not add " + file.name + ": " + e.message);
        document.getElementById("status-text").textContent = "Upload failed";
    }
}

function showImgTooltip(e, node) {
  const tt = document.getElementById('img-tooltip');
  // document.getElementById('img-tooltip-img').src = node.dataUrl;
  document.getElementById('img-tooltip-img').src = node.url || node.downloadUrl || node.dataUrl;
  document.getElementById('img-tooltip-name').textContent = node.name;
  tt.style.display = 'block';
  moveImgTooltip(e);
}
function moveImgTooltip(e) {
  const tt = document.getElementById('img-tooltip');
  let x = e.clientX + 16, y = e.clientY - 80;
  if (x + 200 > window.innerWidth) x = e.clientX - 210;
  if (y < 8) y = 8;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}
function hideImgTooltip() {
  document.getElementById('img-tooltip').style.display = 'none';
}

// ── Theme ────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const btn  = document.getElementById('theme-btn');
  const isLight = root.getAttribute('data-theme') === 'light';
  if (isLight) {
    root.removeAttribute('data-theme');
    btn.textContent = '☀ Light';
    monaco.editor.setTheme('vs-dark');
  } else {
    root.setAttribute('data-theme', 'light');
    btn.textContent = '☾ Dark';
    monaco.editor.setTheme('vs');
  }
}
function debounce(func, delay) {

    let timer;

    return function (...args) {

        clearTimeout(timer);

        timer = setTimeout(
            () => func.apply(this, args),
            delay
        );
    };
}

require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });

require(['vs/editor/editor.main'], function () {
  // LaTeX syntax
  monaco.languages.register({ id: 'latex' });
  monaco.languages.setMonarchTokensProvider('latex', {
    tokenizer: {
      root: [
        [/\\[a-zA-Z@]+/, 'keyword'],
        [/[{}]/, 'delimiter.curly'],
        [/[\[\]]/, 'delimiter.square'],
        [/\$\$[\s\S]*?\$\$/, 'string'],
        [/\$[^$]*?\$/, 'string'],
        [/%.*$/, 'comment'],
        [/\d+/, 'number'],
      ]
    }
  });

  editor = monaco.editor.create(document.getElementById('editor-container'), {
    value: getDefaultLatex(),
    language: 'latex',
    theme: 'vs-dark',
    fontSize: 13,
    fontFamily: "'JetBrains Mono', monospace",
    fontLigatures: true,
    lineHeight: 22,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    wordWrap: 'on',
    padding: { top: 14, bottom: 14 },
    renderLineHighlight: 'line',
    lineNumbers: 'on',
    folding: true,
    automaticLayout: true,
  });

  editor.onDidChangeCursorPosition(e => {
    document.getElementById('cursor-pos').textContent =
      `Ln ${e.position.lineNumber}, Col ${e.position.column}`;
  });

  editor.onDidChangeCursorSelection(() => {
    const sel = editor.getSelection();
    if (!sel || sel.isEmpty()) {
      hideAiBtn(); selectedText = '';
      document.getElementById('selection-info').textContent = '';
      return;
    }
    selectedText = editor.getModel().getValueInRange(sel);
    document.getElementById('selection-info').textContent = `${selectedText.length} chars selected`;

    const endPos = editor.getScrolledVisiblePosition(sel.getEndPosition());
    const rect   = document.getElementById('editor-container').getBoundingClientRect();
    if (endPos) showAiBtn(rect.left + endPos.left + 8, rect.top + endPos.top - 40);
  });

  // editor.onDidChangeModelContent(() => {
  //   document.getElementById('status-text').textContent = 'Editing…';
  //   // clearTimeout(renderTimer);
  //   // renderTimer = setTimeout(renderPreview, 900);
  // });
  editor.onDidChangeModelContent(scheduleSave);

  // setTimeout(renderPreview, 300);
});

function showAiBtn(x, y) {
  const btn = document.getElementById('ai-btn');
  btn.style.left = Math.min(x, window.innerWidth - 130) + 'px';
  btn.style.top  = Math.max(y, 60) + 'px';
  btn.style.display = 'flex';
}
function hideAiBtn() {
  document.getElementById('ai-btn').style.display = 'none';
  closeAiPanel();
}
function openAiPanel() {
  document.getElementById('ai-selection-text').textContent =
    selectedText.length > 200 ? selectedText.slice(0, 200) + '…' : selectedText;
  document.getElementById('ai-panel').style.display = 'block';
}
function closeAiPanel() {
  document.getElementById('ai-selection-text').textContent = "";
  document.getElementById('ai-response').textContent = 'AI responses will appear here...';
  document.getElementById('ai-panel').style.display = 'none';
}
// ── AI Actions (placeholders function fixErrors) ────────────────────────────
async function fixErrors() {

    try {

       const selection =
          editor.getSelection();

      let code =
          editor.getModel().getValueInRange(
              selection
          );

      if (!code.trim()) {

          code =
              editor.getValue();
      }

        if (!code.trim()) {
            alert("Editor is empty");
            return;
        }

        document.getElementById(
            "status-text"
        ).textContent = "AI Fixing...";

        const response = await fetch(
            `${API_BASE}/repair`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    broken_code: code,
                    error_context:
                        "Fix LaTeX compilation errors. Return ONLY corrected LaTeX code."
                })
            }
        );

        if (!response.ok) {

            const errText =
                await response.text();

            throw new Error(
                `HTTP ${response.status}\n${errText}`
            );
        }

        const data =
            await response.json();

        const repairedCode =
            data.repair ||
            data.response;

        if (!repairedCode) {

            throw new Error(
                "No repaired code returned by API"
            );
        }

        // editor.setValue(
        //     repairedCode
        // );
        document.getElementById(
            "ai-response"
        ).textContent =
            repairedCode;
        document.getElementById(
            "status-text"
        ).textContent =
        "AI Fix Complete ✓";

        // closeAiPanel();

    }
    catch(error) {

        console.error(
            "Repair Error:",
            error
        );

        document.getElementById(
            "status-text"
        ).textContent =
        "AI Fix Failed";

        alert(
            "Repair failed:\n\n" +
            error.message
        );
    }
}

// ── Mathematics Notation ─────────────────────────────────────────────
async function displayMath() {
    const selection =
        editor.getSelection();

    let code =
        editor.getModel().getValueInRange(
            selection
        );

    if (!code.trim()) {

        code =
            editor.getValue();
    }

    if (!code.trim()) {
        alert("Editor is empty");
        return;
    }

    document.getElementById(
        "status-text"
    ).textContent = "AI Rendering Math...";

    
    const rendered  = await fetch(
            `${API_BASE}/notation`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    selected_text: code,
                    
                })
            }
        );

        if (!rendered.ok) {

            const errText =
                await rendered.text();

            throw new Error(
                `HTTP ${rendered.status}\n${errText}`
            );
        }

        const data =
              await rendered.json();
        const raw = data.response;

        const cleaned = raw
            .replace(/^```json\s*/i, "")
            .replace(/```$/i, "")
            .trim();

        const notation =
            JSON.parse(cleaned);

        document.getElementById(
            "ai-response"
        ).innerHTML = `
            <div><b>Symbol:</b> ${notation.symbol}</div>
            <div><b>LaTeX:</b> <code>${notation.latex}</code></div>
            <div><b>Usage:</b> ${notation.usage}</div>
        `;
    document.getElementById(
        "status-text"
    ).textContent =
    "Math Rendered ✓";
}

const AGENT_SNIPPETS = {
    table: `\\begin{table}[h]
\\centering
\\begin{tabular}{|c|c|c|}
\\hline
Header 1 & Header 2 & Header 3 \\\\
\\hline
Row 1 & Row 1 & Row 1 \\\\
Row 2 & Row 2 & Row 2 \\\\
\\hline
\\end{tabular}
\\caption{Caption}
\\label{tab:my-table}
\\end{table}
`,
    figure: `\\begin{figure}[h]
\\centering
\\includegraphics[width=0.8\\linewidth]{figure-name}
\\caption{Caption}
\\label{fig:my-figure}
\\end{figure}
`,
    equation: `\\begin{equation}
    a^2 + b^2 = c^2
\\label{eq:my-equation}
\\end{equation}
`,
    list: `\\begin{itemize}
    \\item First item
    \\item Second item
    \\item Third item
\\end{itemize}
`
};

function insertAtCursor(text) {
    if (!editor) return;
    const position = editor.getPosition();
    const range = new monaco.Range(
        position.lineNumber, position.column,
        position.lineNumber, position.column
    );
    editor.executeEdits("agent-bar", [{ range, text, forceMoveMarkers: true }]);
    editor.focus();
}

function agentQuickInsert(kind) {
    const snippet = AGENT_SNIPPETS[kind];
    if (!snippet) return;
    insertAtCursor(snippet);
    document.getElementById("status-text").textContent = `Inserted ${kind}`;
}

function agentRemoveNearest() {
    if (!editor) return;
    const model = editor.getModel();
    const position = editor.getPosition();
    const fullText = model.getValue();
    const cursorOffset = model.getOffsetAt(position);

    // Look for the nearest \begin{...}...\end{...} block that contains or precedes the cursor.
    const blockRegex = /\\begin\{(table|figure|itemize|enumerate|equation|tabular)\*?\}[\s\S]*?\\end\{\1\*?\}\n?/g;
    let match, target = null;
    while ((match = blockRegex.exec(fullText)) !== null) {
        const start = match.index;
        const end = start + match[0].length;
        if (cursorOffset <= end) {
            target = { start, end };
            break;
        }
        target = { start, end }; // keep last seen as fallback (nearest preceding block)
    }

    if (!target) {
        document.getElementById("status-text").textContent = "No table/figure/list/equation found";
        return;
    }

    const startPos = model.getPositionAt(target.start);
    const endPos = model.getPositionAt(target.end);
    const range = new monaco.Range(
        startPos.lineNumber, startPos.column,
        endPos.lineNumber, endPos.column
    );
    editor.executeEdits("agent-bar", [{ range, text: "", forceMoveMarkers: true }]);
    editor.focus();
    document.getElementById("status-text").textContent = "Removed nearest block";
}

async function runAgentCommand() {
    const input = document.getElementById("agent-input");
    const command = input.value.trim();
    if (!command) return;

    const sendBtn = document.getElementById("agent-send");
    const statusEl = document.getElementById("agent-status");
    sendBtn.disabled = true;
    sendBtn.textContent = "…";
    statusEl.style.display = "block";
    statusEl.textContent = "Thinking…";

    try {
        if (/^remove|^delete/i.test(command)) {
            agentRemoveNearest();
            statusEl.textContent = "Done";
            input.value = "";
            return;
        }

        const position = editor.getPosition();
        const model = editor.getModel();
        const offset = model.getOffsetAt(position);
        const fullText = model.getValue();
        const contextBefore = fullText.slice(Math.max(0, offset - 500), offset);
        const contextAfter = fullText.slice(offset, offset + 500);

        const response = await fetch(`${API_BASE}/agent/edit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                command,
                context_before: contextBefore,
                context_after: contextAfter
            })
        });

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`HTTP ${response.status}\n${errText}`);
        }

        const data = await response.json();
        if (data.snippet) {
            insertAtCursor(data.snippet);
            statusEl.textContent = "Inserted ✓";
        } else {
            statusEl.textContent = "Agent returned nothing to insert";
        }
        input.value = "";
    } catch (err) {
        console.error("Agent command failed:", err);
        statusEl.textContent = "Error: " + err.message;
    } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Run";
        setTimeout(() => { statusEl.style.display = "none"; }, 4000);
    }
}

//── Compile function────────────────────────────────────────────
let currentPdfUrl = null;

async function compilePdf() {

    if (compiling) {
        document.getElementById("status-text").textContent = "Already compiling…";
        return;
    }
    compiling = true;
    const compileBtn = document.getElementById("compile-btn");
    compileBtn.disabled = true;
    document.getElementById("status-text").textContent = "Compiling PDF...";

    try {
        // Sync active editor buffer into nodeMap so the file map is up to date
        if (activeNodeId && nodeMap[activeNodeId] && nodeMap[activeNodeId].type === "file") {
            nodeMap[activeNodeId].content = editor.getValue();
        }

        // Build files map (path → content) + images map (path → Cloudinary URL)
        const files = {};
        const images = {};
        Object.values(nodeMap).forEach(node => {
            if (node.type === "file" && node.path && node.content != null) {
                files[node.path] = node.content;
            }
            if (node.type === "image" && node.path && node.url) {
                images[node.path] = node.url;
            }
        });

        if (Object.keys(files).length === 0) {
            alert("No text files in project. Open a file first.");
            document.getElementById("status-text").textContent = "Nothing to compile";
            return;
        }

        // Determine entry file (main.tex preferred, else first .tex file)
        const entryFile =
            Object.keys(files).find(n => n === "main.tex") ||
            Object.keys(files).find(n => n.endsWith(".tex")) ||
            "main.tex";

        let response;
        try {
            response = await fetch(
                `${API_BASE}/compile`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    files: files,
                    images: images,
                    entry: entryFile,
                    projectId: currentProjectId
                })
            }
        );
        } catch (fetchErr) {
            console.error("Compile network error:", fetchErr);
            document.getElementById("status-text").textContent = "Network error";
            return;
        }

        if (!response.ok) {
            // ──error display─────────────────────────────────────────────
            const data =
                  await response.json();

            document.getElementById(
                  "compile-log"
              ).style.display = "block";

            document.getElementById(
                  "compile-log"
              ).textContent =
                  data.log;

            document.getElementById("status-text").textContent = "Compile failed";
            return;
        }

        const blob = await response.blob();

        // FIX 10: revoke previous object URL to avoid memory leak
        if (currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);

        currentPdfUrl = URL.createObjectURL(blob);

        // FIX 9: hide error log on success
        document.getElementById("compile-log").style.display = "none";

        document.getElementById("pdf-viewer").src = currentPdfUrl;
        document.getElementById("status-text").textContent = "Compiled ✓";
    } finally {
        compiling = false;
        compileBtn.disabled = false;
    }
}

function getDefaultLatex() {
  return String.raw`\documentclass{article}
\usepackage{amsmath}

\title{Maxwell's Equations}
\author{James Clerk Maxwell}
\date{1865}

\begin{document}
\maketitle

\begin{abstract}
A concise presentation of the four fundamental equations of classical electromagnetism.
\end{abstract}

\section{Introduction}

Maxwell's equations describe how electric and magnetic fields are generated by
charges, currents, and changes of the fields. They are the foundation of classical
electrodynamics.

\section{The Equations}

\subsection{Gauss's Law}
\begin{equation}
\nabla \cdot \mathbf{E} = \frac{\rho}{\varepsilon_0}
\end{equation}

\subsection{Gauss's Law for Magnetism}
\begin{equation}
\nabla \cdot \mathbf{B} = 0
\end{equation}

\subsection{Faraday's Law}
\begin{equation}
\nabla \times \mathbf{E} = -\frac{\partial \mathbf{B}}{\partial t}
\end{equation}

\subsection{Ampere-Maxwell Law}
\begin{equation}
\nabla \times \mathbf{B} = \mu_0 \mathbf{J} + \mu_0\varepsilon_0 \frac{\partial \mathbf{E}}{\partial t}
\end{equation}

\section{Wave Equation}

From the above, one can derive that light travels at:
\begin{equation}
c = \frac{1}{\sqrt{\mu_0\varepsilon_0}} \approx 3 \times 10^8 \, \text{m/s}
\end{equation}

\end{document}`;
}
